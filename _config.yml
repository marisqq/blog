title: qq Notes
description: Cybersecurity notes and homelab
url: "https://marisqq.github.io"
baseurl: "/blog"

remote_theme: just-the-docs/just-the-docs@v0.10.1

# Footer
gh_edit_link: false

# Search
search_enabled: true
search.heading_level: 3

# Colors — custom Parrot OS hacker theme
color_scheme: parrot

# Kramdown
markdown: kramdown
kramdown:
  hard_wrap: false

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Exclude from build
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .gitignore

# Breadcrumbs (shows parent > child path at top of page)
breadcrumbs: true
