title: qqcyber
description: Cybersecurity notes and blog
url: "https://qqcyber.com"
baseurl: ""

remote_theme: just-the-docs/just-the-docs@v0.10.1

# Footer
gh_edit_link: false

# Search
search_enabled: true
search.heading_level: 3

# Colors — dark theme
color_scheme: dark

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Exclude from build
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .gitignore

# Default front matter
defaults:
  - scope:
      path: "ceh-practical"
      type: "pages"
    values:
      layout: default
      parent: CEH v13 Practical Notes
  - scope:
      path: "ceh-theory"
      type: "pages"
    values:
      layout: default
      parent: CEH v13 Theory Notes
